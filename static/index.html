<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aisthesis — Sonificazione Semantica</title>
    <meta name="description"
        content="Trasforma le tue emozioni in colori e suoni attraverso la Teoria dei Colori di Goethe." />

    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Font: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet" />

    <style>
        /* ============================================================
       RESET & VARIABILI
    ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0eee8;
            --text-muted: rgba(240, 238, 232, 0.45);
            --accent: #c9a96e;
            --blob-1: #7b3fc4;
            --blob-2: #1a6e8a;
            --blob-3: #c4503f;
            --radius: 16px;
            --transition-color: 2.5s ease;
        }

        html,
        body {
            min-height: 100%;
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* ============================================================
       SFERE BLOB — effetto sfondo ambientale
    ============================================================ */
        .blob-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Ogni sfera è un div colorato, molto sfocato, che fluttua lentamente */
        .blob {
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.55;
            /* La proprietà background-color viene animata via JS quando arriva il colore */
            transition: background-color var(--transition-color);
            will-change: transform;
        }

        /* Posizioni di partenza delle sfere */
        .blob-1 {
            background-color: var(--blob-1);
            top: -15%;
            left: -10%;
            animation: float1 18s ease-in-out infinite;
        }

        .blob-2 {
            background-color: var(--blob-2);
            bottom: -20%;
            right: -10%;
            animation: float2 22s ease-in-out infinite;
        }

        .blob-3 {
            background-color: var(--blob-3);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 380px;
            animation: float3 14s ease-in-out infinite;
        }

        /* Keyframes per la fluttuazione delle sfere */
        @keyframes float1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(60px, 40px) scale(1.07);
            }

            66% {
                transform: translate(-30px, 70px) scale(0.96);
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            40% {
                transform: translate(-80px, -50px) scale(1.1);
            }

            70% {
                transform: translate(40px, -30px) scale(0.93);
            }
        }

        @keyframes float3 {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.15) translateY(-40px);
            }
        }

        /* ============================================================
       LAYOUT PRINCIPALE
    ============================================================ */
        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px 80px;
        }

        /* ============================================================
       HEADER / TITOLO
    ============================================================ */
        header {
            text-align: center;
            margin-bottom: 56px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text-primary);
            line-height: 1;
        }

        .logo span {
            /* Sottolineatura dorata animata */
            display: inline-block;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .subtitle {
            margin-top: 14px;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ============================================================
       CARD CENTRALE
    ============================================================ */
        .card {
            width: 100%;
            max-width: 680px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
            z-index: 2;
        }

        /* Label della textarea */
        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Textarea per l'input emotivo */
        #emotion-input {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.7;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #emotion-input::placeholder {
            color: var(--text-muted);
        }

        #emotion-input:focus {
            border-color: rgba(201, 169, 110, 0.5);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.08);
        }

        /* Riga dei pulsanti */
        .btn-row {
            display: flex;
            gap: 14px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .k-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 18px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .k-control-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .k-control-value {
            min-width: 2ch;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        #color-count {
            width: min(220px, 44vw);
            accent-color: var(--accent);
        }

        /* Pulsante primario — Sonifica */
        .btn-primary {
            flex: 1;
            min-width: 200px;
            padding: 15px 28px;
            background: linear-gradient(135deg, #c9a96e 0%, #a07840 100%);
            color: #18120a;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(201, 169, 110, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Pulsante secondario — Non so come mi sento */
        .btn-secondary {
            padding: 15px 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        /* ============================================================
       AREA RISULTATO (Staggered Animations)
    ============================================================ */
        #result-area {
            margin-top: 40px;
            width: 100%;
            max-width: 680px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Shared animation logic for children */
        .stagger-item {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #result-area.visible {
            pointer-events: auto;
        }

        #result-area.visible .stagger-item {
            opacity: 1;
            transform: translateY(0);
        }

        /* Stagger Delays */
        #result-area.visible .delay-1 {
            transition-delay: 0.1s;
        }

        #result-area.visible .delay-2 {
            transition-delay: 0.25s;
        }

        #result-area.visible .delay-3 {
            transition-delay: 0.4s;
        }

        #result-area.visible .delay-4 {
            transition-delay: 0.5s;
        }

        #result-area.visible .delay-5 {
            transition-delay: 0.6s;
        }

        /* Elegante Dashboard Dati */
        .elegant-data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            backdrop-filter: blur(16px);
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .color-chip-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .color-swatch {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: background-color var(--transition-color);
            position: relative;
            z-index: 2;
        }

        /* Glowing aura around color swatch */
        .color-swatch-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(15px);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
            pointer-events: none;
        }

        .is-playing .color-swatch-glow {
            opacity: 0.8;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.9;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }
        }

        .color-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 2;
        }

        .elegant-label {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .elegant-val {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            transition: color 0.5s ease;
        }

        .metric-group {
            display: flex;
            gap: 32px;
            align-items: center;
            z-index: 2;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: right;
        }

        .color-ranking {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranked-color {
            display: grid;
            grid-template-columns: auto 34px 1fr auto;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            backdrop-filter: blur(16px);
        }

        .rank-number {
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .rank-swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .rank-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .rank-title {
            color: var(--text-primary);
            font-size: 0.96rem;
            font-weight: 500;
        }

        .rank-motivation {
            color: rgba(240, 238, 232, 0.68);
            font-size: 0.86rem;
            line-height: 1.5;
        }

        .rank-hex {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        /* Oscilloscope integrato fluidamente */
        #oscilloscope {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 40px;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        /* Citazione di Goethe */
        .quote-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
            padding: 24px 28px;
            backdrop-filter: blur(16px);
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
        }

        /* Descrizione Artistica */
        .artistic-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .artistic-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        .artistic-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            font-weight: 300;
            color: rgba(240, 238, 232, 0.95);
        }

        .replay-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .replay-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ============================================================
       LOADING SPINNER
    ============================================================ */
        #sonify-btn .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(24, 18, 10, 0.4);
            border-top-color: #18120a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
       FOOTER
    ============================================================ */
        footer {
            margin-top: 60px;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(240, 238, 232, 0.2);
            text-align: center;
        }

        @media (max-width: 620px) {
            .card {
                padding: 28px 22px;
            }

            .k-control,
            .elegant-data-row {
                align-items: flex-start;
                flex-direction: column;
            }

            #color-count {
                width: 100%;
            }

            .metric-group {
                width: 100%;
                justify-content: space-between;
                gap: 16px;
            }

            .metric {
                text-align: left;
            }

            .ranked-color {
                grid-template-columns: auto 34px 1fr;
            }

            .rank-hex {
                grid-column: 3;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
       SFERE BLOB DI SFONDO (RIPRISTINATE!)
  ============================================================ -->
    <div class="blob-container" aria-hidden="true">
        <div class="blob blob-1" id="blob1"></div>
        <div class="blob blob-2" id="blob2"></div>
        <div class="blob blob-3" id="blob3"></div>
    </div>

    <!-- ============================================================
       PAGINA PRINCIPALE
  ============================================================ -->
    <main class="page">
        <!-- Header -->
        <header>
            <h1 class="logo"><span>Aisthesis</span></h1>
            <p class="subtitle">Sonificazione semantica · Teoria dei Colori di Goethe</p>
        </header>

        <!-- Card input -->
        <section class="card" aria-label="Input collegato alla semantica testuale">
            <label class="input-label" for="emotion-input">Descrivi la tua emozione</label>
            <textarea id="emotion-input" placeholder="Un brivido dorato nell'alba, come il silenzio della collina..."
                aria-label="Campo di testo per l'emozione"></textarea>

            <div class="k-control">
                <div class="k-control-text">
                    <span class="input-label" style="margin-bottom: 0;">Colori da cercare</span>
                    <span class="elegant-val k-control-value" id="color-count-value">1</span>
                </div>
                <input id="color-count" type="range" min="1" max="8" value="1" step="1"
                    aria-label="Numero di colori da cercare" />
            </div>

            <div class="btn-row">
                <button id="sonify-btn" class="btn-primary" onclick="handleSonify()">
                    Sonifica l'Emozione
                </button>
                <button class="btn-secondary" onclick="insertRandomEmotion()" aria-label="Inserisci seme casuale">
                    Seme Casuale
                </button>
            </div>
        </section>

        <!-- Area risultato (Staggered Animation) -->
        <section id="result-area" aria-live="polite" aria-label="Risultato della sonificazione">

            <!-- Elegant Data Dashboard -->
            <div class="elegant-data-row stagger-item delay-1" id="data-container">
                <div class="color-swatch-glow" id="swatch-glow"></div>
                <div class="color-chip-group">
                    <div class="color-swatch" id="color-swatch"></div>
                    <div class="color-info">
                        <span class="elegant-label">Mix cromatico</span>
                        <span class="elegant-val" id="data-hex">—</span>
                    </div>
                </div>

                <div class="metric-group">
                    <div class="metric">
                        <span class="elegant-label">Armonia</span>
                        <span class="elegant-val" id="data-freq">—</span>
                    </div>
                    <div class="metric">
                        <span class="elegant-label">Tessitura Sonora</span>
                        <span class="elegant-val" id="data-wave"
                            style="text-size: 0.95rem; font-style: italic;">—</span>
                    </div>
                </div>

                <!-- Fluid Background Oscilloscope (Ethereal style) -->
                <canvas id="oscilloscope"></canvas>
            </div>

            <div class="color-ranking stagger-item delay-2" id="colors-list"></div>

            <!-- Citazione di Goethe -->
            <div class="quote-box stagger-item delay-3">
                <p class="quote-text" id="quote-text">...</p>
            </div>

            <!-- Descrizione artistica -->
            <div class="artistic-box stagger-item delay-4">
                <p class="artistic-text" id="artistic-text">...</p>
            </div>

            <button id="replay-btn" class="replay-btn stagger-item delay-5" onclick="replaySound()"
                aria-label="Riascolta Sequenza">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Riascolta l'Emozione
            </button>
        </section>

        <footer>
            <p>Progetto universitario · Aisthesis v0.1</p>
        </footer>
    </main>

    <!-- ============================================================
       JAVASCRIPT
  ============================================================ -->
    <script>
        "use strict";

        // ------------------------------------------------------------------
        // FRASI CASUALI
        // ------------------------------------------------------------------
        const RANDOM_EMOTIONS = ["Un’ansia grigia e granulosa, come sabbia che scorre tra dita troppo stanche.",
"Un’euforia color corallo, il salto improvviso di un pesce in un mare calmo.",
"Una solitudine d’argento, il riflesso della luna su una rotaia abbandonata.",
"Un coraggio blu cobalto, la forza delle onde che scavano la roccia senza fare rumore.",
"Una gelosia verde acido, il ronzio di un insetto che non smette di pungere.",
"Una stanchezza color cenere, la polvere che si deposita sui sogni dimenticati.",
"Un’attesa color ambra, la resina che imprigiona un istante per l’eternità.",
"Una rabbia arancione e distruttiva, il ruggito di un incendio in una prateria secca.",
"Un sollievo bianco latte, la morbidezza di una nuvola che copre un dolore troppo forte.",
"Una timidezza color lavanda, il profumo di un segreto sussurrato a metà.",
"Un rimpianto color fumo, l’ombra di un treno che è già partito dal binario.",
"Una curiosità giallo limone, il lampo di un’idea che accende il buio.",
"Un orgoglio porpora e pesante, il mantello di un re che non ha più un regno.",
"Una speranza verde germoglio, la testardaggine di un fiore che spacca l’asfalto.",
"Un vuoto nero e profondo, l’assenza di gravità in una stanza senza pareti.",
"Una tenerezza rosa cipria, il battito d’ali di una farfalla sulla pelle.",
"Un sospetto color petrolio, una macchia scura che si allarga su un pensiero limpido.",
"Una pace color turchese, il respiro lento dei ghiacciai millenari.",
"Un’amarezza color ruggine, il sapore di un metallo lasciato alle intemperie.",
"Un desiderio color oro, la scia luminosa di una stella che cade lontano.",
"Una noia color fango, il tempo che ristagna in una pozzanghera dopo il temporale.",
"Un incanto color perla, la luce soffusa di un mattino d'inverno.",
"Una ferocia color rubino, il taglio netto di un vetro che brilla sotto il sole.",
"Un’armonia color smeraldo, il canto coordinato di una foresta all'alba.",
"Una confusione color nebbia, un labirinto di specchi dove ogni strada sembra la stessa."];

        function insertRandomEmotion() {
            const textarea = document.getElementById("emotion-input");
            const idx = Math.floor(Math.random() * RANDOM_EMOTIONS.length);
            textarea.value = RANDOM_EMOTIONS[idx];
            textarea.focus();
            textarea.style.borderColor = "var(--accent)";
            setTimeout(() => { textarea.style.borderColor = ""; }, 1200);
        }

        // ------------------------------------------------------------------
        // WEB AUDIO API & ONDA ETREA
        // ------------------------------------------------------------------
        let audioCtx = null;
        let analyser = null;
        let activeNodes = [];
        let lastMelody = null;
        let animFrameId = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                analyser.connect(audioCtx.destination);
                drawEtherealOscilloscope();
            }
        }

        // Oscilloscopio fluido ed "etereo"
        function drawEtherealOscilloscope() {
            const canvas = document.getElementById("oscilloscope");
            const canvasCtx = canvas.getContext("2d");

            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                animFrameId = requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);

                // Pulisce il canvas
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                canvasCtx.lineWidth = 2.5 * window.devicePixelRatio;
                // Onda morbida bianca
                canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                canvasCtx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    // L'onda appare solo in basso fluidamente
                    const y = (v * (canvas.height / 2)) + (canvas.height / 4);

                    if (i === 0) { canvasCtx.moveTo(x, y); }
                    else { canvasCtx.lineTo(x, y); }
                    x += sliceWidth;
                }
                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
            }
            draw();
        }

        let isPlaying = false;

        function setIsPlaying(val) {
            isPlaying = val;
            const container = document.getElementById('data-container');
            if (isPlaying) container.classList.add('is-playing');
            else container.classList.remove('is-playing');
        }

        function playMelody(melody) {
            if (!melody || !melody.length) return;
            initAudio();

            activeNodes.forEach(n => {
                try {
                    n.gain.cancelScheduledValues(audioCtx.currentTime);
                    n.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                    n.osc.stop(audioCtx.currentTime + 0.2);
                } catch (e) { }
            });
            activeNodes = [];

            let startTime = audioCtx.currentTime + 0.1;
            setIsPlaying(true);

            let maxTime = startTime;

            melody.forEach(note => {
                const osc = audioCtx.createOscillator();
                osc.type = note.wave || "sine";
                osc.frequency.setValueAtTime(note.freq, startTime);

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, startTime);

                const attackEnd = startTime + (note.duration * 0.2);
                gainNode.gain.linearRampToValueAtTime(0.25, attackEnd);

                const releaseStart = startTime + (note.duration * 0.8);
                gainNode.gain.setValueAtTime(0.25, releaseStart);

                const noteEnd = startTime + note.duration;
                gainNode.gain.linearRampToValueAtTime(0, noteEnd);

                osc.connect(gainNode);
                gainNode.connect(analyser);

                osc.start(startTime);
                osc.stop(noteEnd + 0.1);

                activeNodes.push({ osc, gain: gainNode.gain });
                startTime += note.duration + 0.05;

                if (noteEnd > maxTime) maxTime = noteEnd;
            });

            // Disattiva il bagliore quando la melodia finisce
            setTimeout(() => {
                setIsPlaying(false);
            }, (maxTime - audioCtx.currentTime) * 1000);
        }

        function replaySound() {
            if (lastMelody) {
                playMelody(lastMelody);
            }
        }

        // ------------------------------------------------------------------
        // AGGIORNAMENTO COLORI (BLOB E VARIABILI)
        // ------------------------------------------------------------------
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            if (!result) return { r: 100, g: 100, b: 200 };
            return {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16),
            };
        }

        function updateBlobColors(hex) {
            document.documentElement.style.setProperty('--accent', hex);

            const { r, g, b } = hexToRgb(hex);

            document.getElementById("blob1").style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            document.getElementById("blob2").style.backgroundColor = `rgb(${255 - r}, ${255 - g}, ${255 - b})`;
            document.getElementById("blob3").style.backgroundColor = `rgb(${Math.floor(r * 0.5)}, ${Math.floor(g * 0.5)}, ${Math.floor(b * 0.5)})`;

            document.getElementById("swatch-glow").style.backgroundColor = hex;
        }

        function renderColorList(colors) {
            const list = document.getElementById("colors-list");
            list.replaceChildren();

            (colors || []).forEach((color, index) => {
                const item = document.createElement("div");
                item.className = "ranked-color";

                const rank = document.createElement("span");
                rank.className = "rank-number";
                rank.textContent = String(color.rank || index + 1).padStart(2, "0");

                const swatch = document.createElement("span");
                swatch.className = "rank-swatch";
                swatch.style.backgroundColor = color.hex || "#777777";

                const copy = document.createElement("div");
                copy.className = "rank-copy";

                const title = document.createElement("span");
                title.className = "rank-title";
                title.textContent = color.name || "Colore";

                const motivation = document.createElement("span");
                motivation.className = "rank-motivation";
                motivation.textContent = color.motivation || "Motivazione non disponibile.";

                const hex = document.createElement("span");
                hex.className = "rank-hex";
                hex.textContent = (color.hex || "").toUpperCase();

                copy.append(title, motivation);
                item.append(rank, swatch, copy, hex);
                list.appendChild(item);
            });
        }

        // ------------------------------------------------------------------
        // LOGICA PRINCIPALE
        // ------------------------------------------------------------------
        async function handleSonify() {
            const textarea = document.getElementById("emotion-input");
            const text = textarea.value.trim();
            const k = Number(document.getElementById("color-count").value) || 1;

            if (!text) {
                textarea.focus();
                textarea.style.borderColor = "rgba(200, 60, 60, 0.7)";
                setTimeout(() => { textarea.style.borderColor = ""; }, 1500);
                return;
            }

            const btn = document.getElementById("sonify-btn");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> In ascolto...';

            try {
                // Rimuovi visibilità per re-trigger l'animazione sfalsata
                document.getElementById("result-area").classList.remove("visible");

                const response = await fetch("/sonify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text, k }),
                });

                if (!response.ok) throw new Error(`Errore HTTP: ${response.status}`);

                const data = await response.json();
                const mixHex = data.mix_hex || data.hex;

                updateBlobColors(mixHex);

                // Aggiorna eleganti dati scientifici
                document.getElementById("color-swatch").style.backgroundColor = mixHex;
                document.getElementById("data-hex").textContent = mixHex.toUpperCase();
                document.getElementById("data-freq").textContent = data.freq.toFixed(1) + " Hz";
                renderColorList(data.colors || []);

                // Valorizzazione artistica della forma d'onda ("Forma")
                const waveTranslations = {
                    'sine': 'Pura e Sinuosa',
                    'triangle': 'Cristallina e Delicata',
                    'square': 'Profonda e Vibrante',
                    'sawtooth': 'Ruvida e Tagliente'
                };
                const waveArtistic = waveTranslations[data.wave.toLowerCase()] || data.wave;
                document.getElementById("data-wave").textContent = waveArtistic;

                document.getElementById("quote-text").textContent = data.quote;

                if (data.artistic_description) {
                    document.getElementById("artistic-text").textContent = data.artistic_description;
                }

                // Aspetta un istante, e attiva l'animazione d'ingresso sfalsata
                setTimeout(() => {
                    document.getElementById("result-area").classList.add("visible");

                    if (data.melody) {
                        lastMelody = data.melody;
                        playMelody(data.melody);
                    } else if (data.freq) {
                        lastMelody = [{ freq: data.freq, duration: 5.0, wave: data.wave || 'sine' }];
                        playMelody(lastMelody);
                    }
                }, 200);

            } catch (error) {
                console.error("Errore durante la sonificazione:", error);
                document.getElementById("quote-text").textContent =
                    "Errore di connessione. Assicurati che il backend sia avviato.";
                renderColorList([]);
                document.getElementById("result-area").classList.add("visible");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Sonifica l'Emozione";
            }
        }

        document.getElementById("color-count").addEventListener("input", (e) => {
            document.getElementById("color-count-value").textContent = e.target.value;
        });

        document.getElementById("emotion-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                handleSonify();
            }
        });
    </script>
